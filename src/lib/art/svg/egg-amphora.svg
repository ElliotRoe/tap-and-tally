<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Soft shadow on the sand. -->
  <ellipse cx="33" cy="63" rx="12" ry="1.6" fill="#3a2a22" opacity=".18"/>
  <g class="egg-body" style="transform-origin: 32px 64px">
    <!-- Two loop handles from the neck down to the shoulders. -->
    <path d="M27.5 12C20 11 16 15 19 23.5" fill="none" stroke="#a85530" stroke-width="3" stroke-linecap="round"/>
    <path d="M36.5 12C44 11 48 15 45 23.5" fill="none" stroke="#a85530" stroke-width="3" stroke-linecap="round"/>
    <!-- Neck, lit on the left and shaded on the right. -->
    <path d="M27.5 8H36.5L37 19H27Z" fill="#c4693f"/>
    <path d="M34 8H36.5L37 19H34Z" fill="#a85530"/>
    <!-- Egg-shaped body, broadest at the shoulder. -->
    <path d="M27 18C19 20 15.5 25 16 31C17 41 24 49 28.5 54H35.5C40 49 47 41 48 31C48.5 25 45 20 37 18Z" fill="#c4693f"/>
    <path d="M37 18C45 20 48.5 25 48 31C47 41 40 49 35.5 54H33C37 48 41.5 40 41.5 31C41.5 25 39.5 20.5 35 18Z" fill="#a85530"/>
    <!-- Black-figure band round the belly, with a simple zigzag. -->
    <path d="M16 29.5Q32 32.5 48 29.5L47 37.5Q32 40.5 17 37.5Z" fill="#3a2a22"/>
    <path d="M19 35.5L22 32.5L25 35.8L28 33.2L31 36.2L34 33.2L37 35.8L40 32.8L43 35.3L45.5 32.5" fill="none" stroke="#c4693f" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Light on the left side, and a few specks. -->
    <path d="M22 22.5C20 24.5 19 26.5 18.8 28.5" fill="none" stroke="#e39a6c" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M19.6 41C20.6 44.5 22.5 47.5 24.6 49.8" fill="none" stroke="#e39a6c" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="25" cy="24" r=".9" fill="#e39a6c"/>
    <circle cx="23.5" cy="44" r=".8" fill="#e39a6c"/>
    <!-- Small flat foot so it stands. -->
    <rect x="29" y="53" width="6" height="6" fill="#a85530"/>
    <path d="M24.5 64C24.5 61 26 58.5 29 58.5H35C38 58.5 39.5 61 39.5 64Z" fill="#c4693f"/>
    <path d="M34 58.5H35C38 58.5 39.5 61 39.5 64H35.5C35.5 61 35 59.5 34 58.5Z" fill="#a85530"/>
    <!-- Flared lip. -->
    <rect x="23.5" y="4" width="17" height="5" rx="2.5" fill="#e39a6c"/>
    <path d="M35 4H38A2.5 2.5 0 0 1 38 9H35Z" fill="#c4693f"/>
  </g>
</svg>
